<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to Power Training Coach</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f7;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 28rem);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 1rem;
        color: #4b5563;
        line-height: 1.5;
      }

      a {
        display: inline-block;
        padding: 0.875rem 1.25rem;
        border-radius: 999px;
        background: #111827;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Payment complete</h1>
      <p>We are returning you to the app to verify your subscription.</p>
      <a id="open-app" href="powertrainingcoach:///subscription?success=true">
        Open Power Training Coach
      </a>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get("session_id");
      const returnTo = params.get("return_to");
      const deepLink = new URL("powertrainingcoach:///subscription");

      deepLink.searchParams.set("success", "true");

      if (/^cs_(test|live)_[A-Za-z0-9_]+$/.test(sessionId || "")) {
        deepLink.searchParams.set("session_id", sessionId);
      }

      if (returnTo) {
        deepLink.searchParams.set("return_to", returnTo);
      }

      const deepLinkHref = deepLink.toString();
      document.getElementById("open-app").href = deepLinkHref;
      window.location.replace(deepLinkHref);
    </script>
  </body>
</html>
