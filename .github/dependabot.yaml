version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
      - "javascript"
      - "expo"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      expo-runtime:
        patterns:
          - "expo"
          - "expo-*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-*"
          - "@react-native-*"
          - "@react-native/*"
      firebase-and-payments:
        patterns:
          - "firebase"
          - "firebase-*"
          - "stripe"
          - "@stripe/*"
      test-tooling:
        dependency-type: "development"
        patterns:
          - "@testing-library/*"
          - "babel-*"
          - "@babel/*"
          - "jest"
          - "jest-*"

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"
    labels:
      - "dependencies"
      - "javascript"
      - "firebase-functions"
    commit-message:
      prefix: "deps(functions)"
      include: "scope"
    groups:
      firebase-functions-runtime:
        dependency-type: "production"
        patterns:
          - "firebase-admin"
          - "firebase-functions"
      functions-tooling:
        dependency-type: "development"
        patterns:
          - "eslint"
          - "eslint-*"
          - "firebase-functions-test"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "android"
      - "gradle"
    commit-message:
      prefix: "deps(android)"
      include: "scope"
    groups:
      android-build-tooling:
        patterns:
          - "com.android.tools.build:*"
          - "com.google.gms:google-services"
          - "org.jetbrains.kotlin:*"
      android-firebase:
        patterns:
          - "com.google.firebase:*"
      android-auth:
        patterns:
          - "androidx.credentials:*"
          - "com.google.android.libraries.identity.googleid:*"
